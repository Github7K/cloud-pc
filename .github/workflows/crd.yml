name: Chrome Remote Desktop

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:

    - name: Enable RDP
      shell: powershell
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
        -Name "fDenyTSConnections" -Value 0

        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Set Password
      shell: powershell
      run: |
        $password = ConvertTo-SecureString "${{ secrets.CRD_PIN }}" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $password

    - name: Download Chrome Remote Desktop
      shell: powershell
      run: |
        Invoke-WebRequest `
        -Uri "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" `
        -OutFile "$env:TEMP\crd.msi"

    - name: Install Chrome Remote Desktop
      shell: powershell
      run: |
        Start-Process msiexec.exe `
        -ArgumentList "/i $env:TEMP\crd.msi /quiet /norestart" `
        -Wait

    - name: Start Chrome Remote Desktop
      shell: powershell
      run: |
        $pin = "${{ secrets.CRD_PIN }}"
        $code = "${{ secrets.CRD_CODE }}"

        & "$env:PROGRAMFILES(X86)\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe" `
        --code="$code" `
        --redirect-url="https://remotedesktop.google.com/_/oauthredirect" `
        --name=$env:COMPUTERNAME `
        --pin="$pin"

    - name: Keep Runner Alive
      shell: powershell
      run: |
        Write-Host "Chrome Remote Desktop Started"
        Write-Host "Connect from https://remotedesktop.google.com/access"

        for (;;) {
          Start-Sleep -Seconds 300
        }
